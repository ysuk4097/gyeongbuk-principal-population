name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Verify population model
        run: node scripts/verify-population.cjs
      - name: Verify organization policy scenarios
        run: node scripts/verify-organization.cjs
      - name: Verify events, evidence, and save compatibility
        run: node scripts/verify-events.cjs
      - name: Verify standalone parity
        run: node scripts/build-standalone.cjs --check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static application
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
